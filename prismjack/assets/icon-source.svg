<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1d2466"/><stop offset="1" stop-color="#0b0f30"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#34449e"/><stop offset="1" stop-color="#232d78"/></linearGradient>
    <linearGradient id="sheen" gradientUnits="userSpaceOnUse" x1="120" y1="560" x2="900" y2="960">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".45" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".16"/><stop offset=".58" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" x2="1"><stop offset="0" stop-color="#fffbe8" stop-opacity=".95"/><stop offset="1" stop-color="#fffbe8" stop-opacity="0"/></linearGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#ffd23f" stop-opacity=".55"/><stop offset="1" stop-color="#ffd23f" stop-opacity="0"/></radialGradient>
    <pattern id="pane" width="130" height="130" patternUnits="userSpaceOnUse" x="122" y="562">
      <path d="M10 120V10H120" fill="none" stroke="#fff" stroke-opacity=".18" stroke-width="5"/>
      <path d="M10 120H120V10" fill="none" stroke="#050822" stroke-opacity=".35" stroke-width="5"/>
    </pattern>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <!-- glass roof -->
  <rect x="122" y="562" width="780" height="390" rx="28" fill="url(#glass)"/>
  <rect x="122" y="562" width="780" height="390" rx="28" fill="url(#pane)"/>
  <g stroke="#aac3ff" stroke-opacity=".35" stroke-width="7">
    <line x1="252" y1="562" x2="252" y2="952"/><line x1="382" y1="562" x2="382" y2="952"/><line x1="512" y1="562" x2="512" y2="952"/>
    <line x1="642" y1="562" x2="642" y2="952"/><line x1="772" y1="562" x2="772" y2="952"/>
    <line x1="122" y1="692" x2="902" y2="692"/><line x1="122" y1="822" x2="902" y2="822"/>
  </g>
  <!-- the jewel, glowing faintly under the glass -->
  <circle cx="512" cy="757" r="220" fill="url(#glow)"/>
  <polygon points="512,627 642,757 512,887 382,757" fill="#ffd23f" fill-opacity=".8" stroke="#ffe680" stroke-width="10" stroke-linejoin="round"/>
  <polygon points="512,627 642,757 512,757" fill="#fff" fill-opacity=".25"/>
  <!-- floor sensors -->
  <g fill="#ff4d6d" opacity=".75"><circle cx="187" cy="627" r="8"/><circle cx="837" cy="627" r="8"/><circle cx="187" cy="887" r="8"/><circle cx="837" cy="887" r="8"/><circle cx="317" cy="887" r="8"/><circle cx="707" cy="627" r="8"/></g>
  <rect x="122" y="562" width="780" height="390" rx="28" fill="url(#sheen)"/>
  <rect x="122" y="562" width="780" height="390" rx="28" fill="none" stroke="#a0e1ff" stroke-opacity=".6" stroke-width="8"/>
  <!-- torch beam from the left wall -->
  <rect x="40" y="722" width="300" height="70" fill="url(#beam)"/>
  <circle cx="64" cy="757" r="44" fill="#c9cee2"/><circle cx="64" cy="757" r="33" fill="#2c3152"/><circle cx="64" cy="757" r="8" fill="#8b90a8"/>
  <!-- the thief, upside down on his rope -->
  <rect x="502" y="0" width="20" height="150" fill="#d8bf8a"/>
  <g transform="translate(512 330) rotate(180) scale(7)">
    <path d="M-20 32c2-12 10-17 20-17s18 5 20 17z" fill="#4b3fb0"/>
    <circle cx="0" cy="0" r="14" fill="#ffd2b0"/>
    <path d="M-15 -2c0-10 7-16 15-16s15 6 15 16c-5-3-10-4-15-4s-10 1-15 4z" fill="#2b2366"/>
    <rect x="-14.5" y="-3" width="29" height="7.5" rx="3.7" fill="#ff4fd8"/>
    <circle cx="-6" cy="0.7" r="2.1" fill="#fff"/><circle cx="6" cy="0.7" r="2.1" fill="#fff"/>
    <path d="M-4 8.5q4 3 8 0" stroke="#a5523a" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  </g>
</svg>
